name: Build Multi-Platform Executables

on:
  push:
    branches:
      - main # Trigger the workflow on pushes to the main branch
      - workflows

jobs:
  # STEP 1: Build an executable for each operating system in parallel
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Python 3.14
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller PySide6

    - name: Build with PyInstaller
      run: pyinstaller --noconsole --onefile --name PycoComputer --clean src/main.py

    - name: Upload the executable as an artifact
      uses: actions/upload-artifact@v4
      with:
        name: executable-${{ matrix.os }} # Unique artifact name for each OS
        path: dist/ # PyInstaller's output directory

  # STEP 2: Package all executables into a single folder
  package:
    runs-on: ubuntu-latest
    needs: build # This job will only run after all 'build' jobs are successful

    steps:
    - name: Create a directory for the executables
      run: mkdir executables

    - name: Download all build artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts # Download all artifacts into this folder

    - name: Display structure of downloaded files
      run: ls -R artifacts

    - name: Organize executables into one folder
      run: |
        # Move executables and rename for clarity
        mv artifacts/executable-ubuntu-latest/PycoComputer executables/PycoComputer-linux
        mv artifacts/executable-windows-latest/PycoComputer.exe executables/PycoComputer.exe
        mv artifacts/executable-macos-latest/PycoComputer executables/PycoComputer-macos

    - name: Upload the final 'executables' folder
      uses: actions/upload-artifact@v4
      with:
        name: executables
        path: executables/