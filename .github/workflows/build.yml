name: Automated Version Release

on:
  push:
    branches:
      - workflows # Monitors this branch for version bumps
    tags:
      - 'v*' # Builds releases when a tag is pushed

jobs:
  # JOB 1: Monitor for version changes and create a tag.
  version-monitor:
    if: startsWith(github.ref, 'refs/heads/workflows')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
    permissions:
      contents: write # Allow writing tags
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Find changed files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files: pixi.toml
      - name: Check for new version in pixi.toml
        id: check
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          VERSION=$(grep 'version =' pixi.toml | cut -d '"' -f 2)
          echo "Found version in pixi.toml: $VERSION"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists. Nothing to do."
          else
            echo "Tag v$VERSION does not exist. A new release will be created."
            echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          fi
      - name: Create and push new Git tag
        if: steps.check.outputs.tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.check.outputs.tag }}
          git push origin ${{ steps.check.outputs.tag }}

  # JOB 2: Build the executables when a tag is pushed.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    # REMOVED: needs: version-monitor <-- This was the line causing the problem.
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Install Pixi
        uses: prefix-dev/setup-pixi@v0.5.1
      - name: Install dependencies
        run: pixi install -e dev
      - name: Build with Pixi task
        run: pixi run build
      - name: Rename executable for release
        run: |
          if [ "${{ runner.os }}" == "Windows" ]; then
            mv dist/PycoComputer.exe dist/PycoComputer-windows.exe
          elif [ "${{ runner.os }}" == "Linux" ]; then
            mv dist/PycoComputer dist/PycoComputer-linux
          else
            mv dist/PycoComputer dist/PycoComputer-macos
          fi
      - name: Upload artifact for release
        uses: actions/upload-artifact@v4
        with:
          name: executable-${{ matrix.os }}
          path: dist/*

  # JOB 3: Combine artifacts and publish the GitHub Release.
  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: release # This dependency is correct, it waits for all builds.
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/executable-ubuntu-latest/*
            artifacts/executable-windows-latest/*
            artifacts/executable-macos-latest/*